<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkTime — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F7F4;
    --paper-2:#F1F1EE;
    --grid-line: rgba(45,90,140,0.08);
    --ink:#1C2B3A;
    --ink-soft:#5B6B7A;
    --ink-faint:#94A1AC;
    --line:#DCE2E6;
    --line-strong:#B9C3CA;
    --blue:#2D5A8C;
    --blue-deep:#1C3A57;
    --blue-soft:#E8EFF5;
    --green:#3F8F5F;
    --green-soft:#E7F3EB;
    --amber:#B9822C;
    --amber-soft:#FBF1DF;
    --red:#BE4230;
    --red-soft:#FBEAE6;
    --white:#FFFFFF;
    --radius:3px;
    --font-ui:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    --shadow-1: 0 1px 2px rgba(28,43,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-ui);
    color:var(--ink);
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/100% 28px,
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--blue-soft); color:var(--blue-deep); }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  a{ color:inherit; }

  /* ---------- layout ---------- */
  .app{
    display:grid;
    grid-template-columns: 224px 1fr;
    min-height:100vh;
  }
  .sidebar{
    border-right:1px solid var(--line);
    background: var(--white);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 6px 22px 6px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .brand-mark{
    width:22px;height:22px;
    border:1.5px solid var(--ink);
    border-radius:2px;
    position:relative;
    flex:none;
  }
  .brand-mark::before{
    content:"";
    position:absolute; left:3px; top:3px; right:3px; bottom:9px;
    border-bottom:1.5px solid var(--ink);
  }
  .brand-mark::after{
    content:"";
    position:absolute; left:3px; right:3px; bottom:3px; height:2px;
    background:
      linear-gradient(90deg, var(--blue) 0 40%, transparent 40% 100%);
  }
  .brand-name{ font-weight:600; font-size:15px; letter-spacing:-0.01em; }
  .brand-tag{ font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); }

  nav.nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:var(--radius);
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:500;
    border:1px solid transparent;
    background:none;
    text-align:left;
    width:100%;
  }
  .nav-item svg{ flex:none; opacity:0.8; }
  .nav-item:hover{ background:var(--paper-2); color:var(--ink); }
  .nav-item.active{
    background:var(--blue-soft);
    color:var(--blue-deep);
    border-color:rgba(45,90,140,0.18);
  }
  .nav-item.active svg{ opacity:1; }

  .nav-divider{
    margin:14px 8px 6px 8px;
    padding-top:12px;
    border-top:1px solid var(--line);
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-faint);
  }

  .sidebar-foot{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .mini-gauge-label{
    font-size:10.5px; text-transform:none; color:var(--ink-faint);
    font-family:var(--font-mono);
    display:flex; justify-content:space-between; margin-bottom:6px;
  }
  .mini-gauge{
    height:6px; border-radius:3px; background:var(--paper-2);
    border:1px solid var(--line); overflow:hidden; position:relative;
  }
  .mini-gauge-fill{ height:100%; background:var(--blue); }

  main.content{ padding:26px 34px 60px 34px; max-width:1180px; }

  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; gap:20px; flex-wrap:wrap;
  }
  .view-eyebrow{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:4px; }
  .view-title{ font-size:23px; font-weight:600; letter-spacing:-0.015em; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 14px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    font-size:13px; font-weight:500;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--blue-deep); border-color:var(--blue-deep); }
  .btn.secondary{ background:var(--white); color:var(--ink); border-color:var(--line-strong); }
  .btn.secondary:hover{ background:var(--paper-2); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); padding:8px 10px; }
  .btn.ghost:hover{ background:var(--paper-2); color:var(--ink); }
  .btn.danger{ background:var(--white); color:var(--red); border-color:rgba(190,66,48,0.35); }
  .btn.danger:hover{ background:var(--red-soft); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  /* ---------- date strip ---------- */
  .date-strip{ display:flex; align-items:center; gap:4px; }
  .date-arrow{
    width:28px;height:28px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--white);
    color:var(--ink-soft);
  }
  .date-arrow:hover{ background:var(--paper-2); }
  .date-pill{
    padding:6px 12px; border-radius:var(--radius); font-size:12.5px; font-weight:500;
    color:var(--ink-soft); border:1px solid transparent; font-family:var(--font-mono);
  }
  .date-pill:hover{ background:var(--paper-2); }
  .date-pill.is-today{ color:var(--blue-deep); }
  .date-pill.is-active{ background:var(--ink); color:var(--white); border-color:var(--ink); }

  /* ---------- capacity gauge panel ---------- */
  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow-1);
  }
  .gauge-panel{ padding:20px 22px; margin-bottom:22px; position:relative; }
  .corner-tick{ position:absolute; width:9px; height:9px; opacity:0.55; }
  .corner-tick.tl{ top:8px; left:8px; border-top:1px solid var(--blue); border-left:1px solid var(--blue); }
  .corner-tick.tr{ top:8px; right:8px; border-top:1px solid var(--blue); border-right:1px solid var(--blue); }
  .corner-tick.bl{ bottom:8px; left:8px; border-bottom:1px solid var(--blue); border-left:1px solid var(--blue); }
  .corner-tick.br{ bottom:8px; right:8px; border-bottom:1px solid var(--blue); border-right:1px solid var(--blue); }

  .gauge-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .gauge-greeting{ font-size:15px; font-weight:500; color:var(--ink-soft); }
  .gauge-status{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:12px; font-weight:500;
    padding:5px 10px; border-radius:20px; border:1px solid transparent;
  }
  .gauge-status .dot{ width:6px; height:6px; border-radius:50%; }
  .status-ok{ background:var(--green-soft); color:#2E6B44; }
  .status-ok .dot{ background:var(--green); }
  .status-tight{ background:var(--amber-soft); color:#8A6019; }
  .status-tight .dot{ background:var(--amber); }
  .status-risk{ background:var(--red-soft); color:#8E3324; }
  .status-risk .dot{ background:var(--red); }

  .gauge-stats{ display:flex; gap:34px; margin-bottom:14px; flex-wrap:wrap; }
  .gauge-stat-label{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); margin-bottom:3px; }
  .gauge-stat-value{ font-size:22px; font-weight:600; letter-spacing:-0.02em; font-family:var(--font-mono);}
  .gauge-stat-value.red{ color:var(--red); }
  .gauge-stat-value.green{ color:var(--green); }

  .gauge-bar-track{
    height:14px; border-radius:3px; background:var(--paper-2);
    border:1px solid var(--line); position:relative; overflow:hidden;
  }
  .gauge-bar-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--blue); }
  .gauge-bar-over{ position:absolute; top:0; bottom:0; background:
      repeating-linear-gradient(45deg, var(--red) 0 4px, #E2887A 4px 8px); }
  .gauge-bar-marker{
    position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink);
  }
  .gauge-bar-marker::after{
    content: attr(data-label);
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); white-space:nowrap;
  }

  /* ---------- timeline ---------- */
  .timeline-wrap{ display:flex; gap:16px; }
  .timeline{
    flex:1; position:relative; background:var(--white);
    border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1);
    padding:10px 18px 22px 64px;
  }
  .weekend-note{
    padding:50px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;
  }
  .hour-row{ position:relative; border-top:1px solid var(--line); }
  .hour-row:last-child{ border-bottom:1px solid var(--line); }
  .hour-label{
    position:absolute; left:-52px; top:-7px; width:44px; text-align:right;
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);
  }
  .track{ position:relative; }
  .block-card{
    position:absolute; left:0; right:10px;
    background:var(--white); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:8px 10px 9px 10px; overflow:hidden; cursor:grab;
    transition: box-shadow .12s ease, border-color .12s ease;
  }
  .block-card:hover{ border-color:var(--blue); box-shadow: 0 2px 6px rgba(28,43,58,0.10); }
  .block-card.dragging{ opacity:0.4; }
  .block-card.drop-before{ border-top:2px solid var(--blue); }
  .block-card.drop-after{ border-bottom:2px solid var(--blue); }

  .insert-gap{
    position:absolute; left:0; right:10px; height:18px; z-index:3;
    display:flex; align-items:center; justify-content:center;
  }
  .insert-gap-line{
    position:absolute; left:0; right:0; top:50%; height:1px; background:transparent; transition:background .12s ease;
  }
  .insert-gap-btn{
    position:relative; opacity:0; transform:scale(0.92); pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--font-mono); font-size:10.5px; color:var(--blue-deep);
    background:var(--blue-soft); border:1px solid rgba(45,90,140,0.4); border-radius:20px;
    padding:3px 10px 3px 8px;
  }
  .insert-gap:hover .insert-gap-line{ background:var(--blue); }
  .insert-gap:hover .insert-gap-btn{ opacity:1; transform:scale(1); pointer-events:auto; cursor:pointer; }

  .quick-insert{
    position:fixed; z-index:70; background:var(--white); border:1px solid var(--line-strong);
    border-radius:8px; box-shadow:0 10px 28px rgba(28,43,58,0.22); padding:12px; width:280px;
  }
  .quick-insert input[type="text"], .quick-insert input[type="number"], .quick-insert select{
    width:100%; padding:7px 9px; border:1px solid var(--line-strong); border-radius:var(--radius);
    font-size:13px; font-family:var(--font-ui); margin-bottom:8px; background:var(--white); color:var(--ink);
  }
  .quick-insert-row{ display:flex; gap:8px; }
  .quick-insert-row > *{ flex:1; }
  .quick-insert-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .quick-insert-more{ background:none; border:none; color:var(--ink-faint); font-size:11px; padding:4px 0; text-decoration:underline; }
  .quick-insert-more:hover{ color:var(--ink); }
  .quick-insert-actions{ display:flex; gap:6px; }
  .block-time-tab{
    position:absolute; top:0; left:0; font-family:var(--font-mono); font-size:9.5px;
    color:var(--blue-deep); background:var(--blue-soft); padding:1px 6px 2px 6px; border-radius:0 0 3px 0;
  }
  .block-body{ margin-top:13px; }
  .block-title{ font-size:12.5px; font-weight:600; line-height:1.25; margin-bottom:1px; }
  .block-sub{ font-size:11px; color:var(--ink-soft); margin-bottom:5px; }
  .block-meta{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .block-chip{ font-size:10.5px; color:var(--ink-faint); display:flex; align-items:center; gap:3px; font-family:var(--font-mono); }
  .prio-dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }
  .prio-High{ background:var(--ink); }
  .prio-Medium{ background:var(--ink-soft); }
  .prio-Low{ background:var(--line-strong); }
  .block-move{
    position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:3px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
    border:1px solid transparent; background:none;
  }
  .block-move:hover{ background:var(--paper-2); color:var(--ink); border-color:var(--line); }

  .overflow-zone{
    margin-top:18px; padding-top:16px; border-top:1px dashed var(--line-strong);
  }
  .overflow-zone-title{
    display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:600; color:var(--red); margin-bottom:10px;
  }
  .overflow-card{
    background:var(--red-soft); border:1px dashed rgba(190,66,48,0.45); border-radius:var(--radius);
    padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .overflow-card-main{ flex:1; }
  .overflow-card-title{ font-size:12.5px; font-weight:600; margin-bottom:2px; }
  .overflow-card-note{ font-size:11px; color:#8E3324; }

  /* ---------- side panels: sidebar cards (list views) ---------- */
  .day-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:6px; }
  .day-card{
    background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1);
    padding:14px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:8px;
  }
  .day-card:hover{ border-color:var(--blue); }
  .day-card.is-today{ border-color:var(--blue); background:var(--blue-soft); }
  .day-card-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .day-card-weekday{ font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); }
  .day-card-date{ font-size:15px; font-weight:600; }
  .day-card-hours{ font-family:var(--font-mono); font-size:19px; font-weight:600; }
  .day-card-bar{ height:6px; border-radius:3px; background:var(--paper-2); border:1px solid var(--line); overflow:hidden; }
  .day-card-bar-fill{ height:100%; }
  .day-card-count{ font-size:11px; color:var(--ink-soft); }

  .week-chart{ background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1); padding:22px; margin-top:6px; }
  .week-chart-row{ display:flex; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--paper-2); }
  .week-chart-row:last-child{ border-bottom:none; }
  .week-chart-day{ width:100px; flex:none; }
  .week-chart-day-name{ font-size:12.5px; font-weight:600; }
  .week-chart-day-date{ font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); }
  .week-chart-track{ flex:1; height:16px; border-radius:3px; background:var(--paper-2); border:1px solid var(--line); position:relative; overflow:hidden; }
  .week-chart-fill{ position:absolute; left:0; top:0; bottom:0; }
  .week-chart-num{ width:130px; flex:none; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); }
  .week-chart-badge{ width:70px; flex:none; }

  .table-panel{ background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1); overflow:hidden; margin-top:6px; }
  table.tasks-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.tasks-table th{
    text-align:left; padding:11px 16px; font-family:var(--font-mono); font-weight:500;
    font-size:10.5px; color:var(--ink-faint); border-bottom:1px solid var(--line); background:var(--paper-2);
  }
  table.tasks-table td{ padding:12px 16px; border-bottom:1px solid var(--paper-2); vertical-align:middle; }
  table.tasks-table tr:last-child td{ border-bottom:none; }
  table.tasks-table tbody tr{ cursor:pointer; }
  table.tasks-table tbody tr:hover{ background:var(--paper-2); }
  .task-title-cell{ font-weight:600; }
  .task-desc-cell{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px; border-radius:12px; font-weight:500; }
  .badge.b-ok{ background:var(--green-soft); color:#2E6B44; }
  .badge.b-tight{ background:var(--amber-soft); color:#8A6019; }
  .badge.b-risk{ background:var(--red-soft); color:#8E3324; }
  .badge.b-neutral{ background:var(--paper-2); color:var(--ink-soft); }

  /* ---------- admin: team, projects, reports ---------- */
  .user-avatar{
    width:32px; height:32px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--white);
  }
  .avatar-stack{ display:flex; }
  .avatar-stack .user-avatar{ width:24px; height:24px; font-size:9.5px; margin-left:-7px; border:2px solid var(--white); }
  .avatar-stack .user-avatar:first-child{ margin-left:0; }

  .people-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; margin-top:6px; }
  .user-card{
    background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1);
    padding:16px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
  }
  .user-card:hover{ border-color:var(--blue); }
  .user-card-top{ display:flex; align-items:center; gap:10px; }
  .user-card-name{ font-size:13.5px; font-weight:600; }
  .user-card-role{ font-size:11px; color:var(--ink-faint); }
  .user-card-stats{ display:flex; align-items:baseline; justify-content:space-between; }
  .user-card-hours{ font-family:var(--font-mono); font-size:16px; font-weight:600; }
  .week-dots{ display:flex; gap:5px; }
  .week-dot{ width:8px; height:8px; border-radius:50%; background:var(--line-strong); }
  .week-dot.wd-ok{ background:var(--green); }
  .week-dot.wd-tight{ background:var(--amber); }
  .week-dot.wd-risk{ background:var(--red); }

  .progress-track{ height:7px; border-radius:4px; background:var(--paper-2); border:1px solid var(--line); overflow:hidden; }
  .progress-fill{ height:100%; }

  .project-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; margin-top:6px; }
  .project-card{
    background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1);
    padding:0; cursor:pointer; text-align:left; overflow:hidden; display:flex; flex-direction:column;
  }
  .project-card:hover{ border-color:var(--blue); }
  .project-card-bar{ height:5px; }
  .project-card-body{ padding:15px 16px; display:flex; flex-direction:column; gap:10px; }
  .project-card-name{ font-size:14px; font-weight:600; }
  .project-card-desc{ font-size:11.5px; color:var(--ink-faint); line-height:1.4; min-height:2.6em; }
  .project-card-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); font-family:var(--font-mono); }

  .report-panel{ background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1); padding:20px 22px; margin-bottom:20px; }
  .report-panel h3{ margin:0 0 14px 0; font-size:13px; font-weight:600; }
  .report-row{ display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--paper-2); }
  .report-row:last-child{ border-bottom:none; }
  .report-row.clickable{ cursor:pointer; margin:0 -8px; padding:10px 8px; border-radius:4px; }
  .report-row.clickable:hover{ background:var(--paper-2); }
  .report-row-main{ flex:1; min-width:0; }
  .report-row-title{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .report-row-sub{ font-size:11px; color:var(--ink-faint); }
  .risk-list-empty{ font-size:12.5px; color:var(--ink-faint); padding:6px 0; }

  .color-swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .color-pick{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-pick label{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; padding:5px 9px; border:1px solid var(--line-strong); border-radius:20px; }
  .color-pick input{ margin:0; }
  .color-pick input:checked + span{ font-weight:600; color:var(--ink); }

  /* ---------- settings ---------- */
  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:6px; max-width:760px; }
  .field-group{ background:var(--white); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-1); padding:18px 20px; }
  .field-group h3{ margin:0 0 14px 0; font-size:13px; font-weight:600; }
  .field{ margin-bottom:13px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--radius);
    font-size:13px; background:var(--white); color:var(--ink); font-family:var(--font-mono);
  }
  .field input:focus, .field select:focus, textarea:focus{ outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .settings-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,43,58,0.42); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--white); border-radius:8px; width:460px; max-width:100%; max-height:90vh; overflow-y:auto;
    border:1px solid var(--line); box-shadow:0 12px 34px rgba(28,43,58,0.22);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
  .modal-head h2{ margin:0; font-size:16px; font-weight:600; }
  .modal-close{ width:26px; height:26px; border-radius:4px; border:none; background:none; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
  .modal-close:hover{ background:var(--paper-2); }
  .modal-body{ padding:18px 20px; }
  .modal-foot{ padding:16px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
  textarea{ width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--radius); font-size:13px; resize:vertical; min-height:56px; font-family:var(--font-ui); }

  /* ---------- detail panel ---------- */
  .detail-overlay{ position:fixed; inset:0; background:rgba(28,43,58,0.32); z-index:60; }
  .detail-panel{
    position:fixed; top:0; right:0; bottom:0; width:400px; max-width:92vw; background:var(--white);
    border-left:1px solid var(--line); box-shadow:-14px 0 34px rgba(28,43,58,0.18); z-index:61;
    display:flex; flex-direction:column;
  }
  .detail-head{ padding:20px; border-bottom:1px solid var(--line); }
  .detail-head-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .detail-project{ font-family:var(--font-mono); font-size:10.5px; color:var(--blue); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px; }
  .detail-title{ font-size:19px; font-weight:600; letter-spacing:-0.01em; }
  .detail-body{ padding:20px; overflow-y:auto; flex:1; }
  .detail-section{ margin-bottom:22px; }
  .detail-section h4{ margin:0 0 10px 0; font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); font-weight:500; text-transform:none; }
  .detail-desc{ font-size:13px; color:var(--ink-soft); line-height:1.55; }
  .detail-stats{ display:flex; gap:22px; }
  .detail-stat-label{ font-size:10.5px; color:var(--ink-faint); margin-bottom:3px; }
  .detail-stat-value{ font-size:17px; font-weight:600; font-family:var(--font-mono); }
  .detail-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--paper-2); }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row-label{ color:var(--ink-soft); }
  .history-item{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--paper-2); }
  .history-item:last-child{ border-bottom:none; }
  .history-dot{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); margin-top:5px; flex:none; }
  .history-item.is-move .history-dot{ background:var(--amber); }
  .history-when{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }
  .history-text{ font-size:12.5px; color:var(--ink); margin-top:1px; }
  .detail-foot{ padding:16px 20px; border-top:1px solid var(--line); display:flex; gap:10px; }

  /* ---------- toast ---------- */
  .toast-container{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{
    background:var(--ink); color:var(--white); padding:10px 16px; border-radius:6px; font-size:13px;
    box-shadow:0 8px 20px rgba(28,43,58,0.28); display:flex; align-items:center; gap:9px;
    animation: toast-in .18s ease;
  }
  .toast.warn{ background:var(--red); }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0);} }

  .empty-hint{ font-size:12px; color:var(--ink-faint); padding:16px 0 4px 0; }

  @media (max-width: 880px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ position:relative; height:auto; flex-direction:row; align-items:center; padding:12px 14px; }
    .brand{ border:none; padding:0; margin:0; }
    .brand-tag{ display:none; }
    nav.nav{ flex-direction:row; margin-left:auto; }
    .nav-item span{ display:none; }
    .sidebar-foot{ display:none; }
    main.content{ padding:18px; }
    .day-grid{ grid-template-columns:repeat(2,1fr); }
    .settings-grid{ grid-template-columns:1fr; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============================================================
     DATE HELPERS
  ============================================================ */
  const pad = n => String(n).padStart(2,'0');
  const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const keyToDate = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const isWorkday = d => { const g = d.getDay(); return g>=1 && g<=5; };
  const nextWorkday = d => { let r = addDays(d,1); while(!isWorkday(r)) r = addDays(r,1); return r; };
  const fmtShort = d => d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
  const fmtLong = d => d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const fmtWeekday = d => d.toLocaleDateString('en-US',{weekday:'short'});
  const fmtWeekdayLong = d => d.toLocaleDateString('en-US',{weekday:'long'});
  const t2m = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const fmtClock = mins => {
    let h = Math.floor(mins/60), m = mins%60;
    const ap = h>=12 ? 'PM':'AM';
    let hh = h % 12; if(hh===0) hh=12;
    return `${hh}:${pad(m)} ${ap}`;
  };
  const relDay = key => {
    const diff = Math.round((keyToDate(key)-TODAY_DATE)/86400000);
    if(diff===0) return 'Today';
    if(diff===1) return 'Tomorrow';
    if(diff===-1) return 'Yesterday';
    return fmtShort(keyToDate(key));
  };

  const TODAY_DATE = new Date(2026,8,3); // Thu Sep 3, 2026
  const TODAY_KEY = dkey(TODAY_DATE);
  const MON = addDays(TODAY_DATE,-3), TUE = addDays(TODAY_DATE,-2), WED = addDays(TODAY_DATE,-1),
        THU = TODAY_DATE, FRI = addDays(TODAY_DATE,1);

  /* ============================================================
     STATE
  ============================================================ */
  const settings = { workStart:'09:00', workEnd:'18:00', capacity:8, defaultSlot:60 };

  // The end of the working day is never set directly — it's derived from start time
  // and daily capacity, so the engine (not the person) does the math.
  function deriveWorkEnd(){
    const endM = t2m(settings.workStart) + settings.capacity*60;
    settings.workEnd = `${pad(Math.floor(endM/60)%24)}:${pad(endM%60)}`;
  }

  /* ============================================================
     PEOPLE & PROJECTS (admin-managed)
  ============================================================ */
  const users = [
    {id:'u1', name:'Alex Chen',  role:'Software Engineer', department:'Engineering', email:'alex@worktime.io',   capacity:8, color:'#2D5A8C'},
    {id:'u2', name:'Priya Nair', role:'Product Designer',  department:'Design',      email:'priya@worktime.io',  capacity:7, color:'#7C4A9E'},
    {id:'u3', name:'Marcus Webb',role:'Sales Lead',        department:'Sales',       email:'marcus@worktime.io', capacity:8, color:'#1F7A6C'},
    {id:'u4', name:'Jordan Lee', role:'QA Engineer',       department:'Engineering', email:'jordan@worktime.io', capacity:8, color:'#8C5A2B'}
  ];
  const currentUserId = 'u1'; // "you" — the only fully editable, drag-and-drop schedule in this prototype

  const projects = [
    {id:'p1', name:'CRM',      color:'#2D5A8C', description:'Customer management module — engineering, design and QA.'},
    {id:'p2', name:'Sales',    color:'#6B4FA0', description:'Pipeline, proposals and client outreach.'},
    {id:'p3', name:'Meridian', color:'#1F7A6C', description:'Meridian account relationship and renewal.'},
    {id:'p4', name:'Personal', color:'#8B98A5', description:'Breaks and personal time.'},
    {id:'p5', name:'General',  color:'#B9C3CA', description:'Uncategorized or one-off work.'}
  ];
  let projSeq = projects.length + 1;
  let userSeq = users.length + 1;

  function userById(id){ return users.find(u=>u.id===id); }
  function projectByName(name){ return projects.find(p=>p.name===name); }
  function initials(name){ return name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

  let taskSeq = 1, blockSeq = 1, histSeq = 1;
  const newTaskId = () => 't' + (taskSeq++);
  const newBlockId = () => 'b' + (blockSeq++);

  const tasks = [];
  const blocks = [];
  const history = [];

  function seedTask(t){ tasks.push(Object.assign({id:newTaskId(), completedHours:0, description:'', userId:currentUserId}, t)); return tasks[tasks.length-1].id; }
  function seedBlock(b){ blocks.push(Object.assign({id:newBlockId(), overflow:false, start:null, end:null, pushedFrom:null}, b)); return blocks[blocks.length-1].id; }

  // --- Monday (past, completed) ---
  const tClientSync = seedTask({title:'Client Sync', project:'Meridian', description:'Weekly account sync with the Meridian stakeholders.', estimatedHours:3, completedHours:3, deadline:dkey(MON), priority:'Medium', status:'Completed'});
  const tBreakMon = seedTask({title:'Lunch Break', project:'Personal', description:'Time away from the desk — scheduled like any other task.', estimatedHours:1, completedHours:1, deadline:dkey(MON), priority:'Low', status:'Completed'});
  const tDesignReview = seedTask({title:'Design Review', project:'CRM', description:'Review UI proposals for the customer module with the design team.', estimatedHours:3, completedHours:3, deadline:dkey(MON), priority:'Low', status:'Completed'});
  seedBlock({taskId:tClientSync, day:dkey(MON), order:0, duration:3});
  seedBlock({taskId:tBreakMon, day:dkey(MON), order:1, duration:1});
  seedBlock({taskId:tDesignReview, day:dkey(MON), order:2, duration:3});

  // --- Tuesday (past, completed) ---
  const tSprintPlanning = seedTask({title:'Sprint Planning', project:'CRM', description:'Plan the two-week sprint scope with the team.', estimatedHours:3, completedHours:3, deadline:dkey(TUE), priority:'Medium', status:'Completed'});
  const tBreakTue = seedTask({title:'Lunch Break', project:'Personal', description:'Time away from the desk — scheduled like any other task.', estimatedHours:1, completedHours:1, deadline:dkey(TUE), priority:'Low', status:'Completed'});
  const tFeatureBuild1 = seedTask({title:'Feature Build — Contacts', project:'CRM', description:'Build the contacts list view for the customer module.', estimatedHours:4, completedHours:4, deadline:dkey(TUE), priority:'High', status:'Completed'});
  seedBlock({taskId:tSprintPlanning, day:dkey(TUE), order:0, duration:3});
  seedBlock({taskId:tBreakTue, day:dkey(TUE), order:1, duration:1});
  seedBlock({taskId:tFeatureBuild1, day:dkey(TUE), order:2, duration:4});

  // --- Wednesday (past, slightly overloaded — historical) ---
  const tFeatureBuild2 = seedTask({title:'Feature Build — Payments', project:'CRM', description:'Wire up the payments panel inside the customer module.', estimatedHours:4, completedHours:4, deadline:dkey(WED), priority:'High', status:'Completed'});
  const tBreakWed = seedTask({title:'Lunch Break', project:'Personal', description:'Time away from the desk — scheduled like any other task.', estimatedHours:1, completedHours:1, deadline:dkey(WED), priority:'Low', status:'Completed'});
  const tCodeReview = seedTask({title:'Code Review', project:'CRM', description:'Review open pull requests from the sprint.', estimatedHours:4, completedHours:4, deadline:dkey(WED), priority:'Medium', status:'Completed'});
  seedBlock({taskId:tFeatureBuild2, day:dkey(WED), order:0, duration:4});
  seedBlock({taskId:tBreakWed, day:dkey(WED), order:1, duration:1});
  seedBlock({taskId:tCodeReview, day:dkey(WED), order:2, duration:4});

  // --- Thursday = TODAY (the live, interactive day) ---
  const tCRMDev = seedTask({title:'CRM Development', project:'CRM', description:'Complete the customer management module: contacts, integrations and QA.', estimatedHours:8, completedHours:4, deadline:dkey(FRI), priority:'High', status:'In Progress'});
  const tBreakThu = seedTask({title:'Lunch Break', project:'Personal', description:'Time away from the desk — scheduled like any other task.', estimatedHours:1, completedHours:0, deadline:TODAY_KEY, priority:'Low', status:'Planned'});
  const tCRMDocs = seedTask({title:'CRM Documentation', project:'CRM', description:'Write end-user and API documentation for the customer module.', estimatedHours:1, completedHours:0, deadline:dkey(addDays(TODAY_DATE,2)), priority:'Medium', status:'Planned'});
  seedBlock({taskId:tCRMDev, day:TODAY_KEY, order:0, duration:2, label:'Customer Module'});
  seedBlock({taskId:tCRMDev, day:TODAY_KEY, order:1, duration:2, label:'API Integration'});
  seedBlock({taskId:tBreakThu, day:TODAY_KEY, order:2, duration:1});
  seedBlock({taskId:tCRMDev, day:TODAY_KEY, order:3, duration:2, label:'Testing'});
  seedBlock({taskId:tCRMDocs, day:TODAY_KEY, order:4, duration:1});

  // --- Friday (future, planned) ---
  const tRetro = seedTask({title:'Sprint Retro', project:'CRM', description:'Retrospective on the last two-week sprint.', estimatedHours:2, completedHours:0, deadline:dkey(FRI), priority:'Low', status:'Planned'});
  const tBreakFri = seedTask({title:'Lunch Break', project:'Personal', description:'Time away from the desk — scheduled like any other task.', estimatedHours:1, completedHours:0, deadline:dkey(FRI), priority:'Low', status:'Planned'});
  const tBuffer = seedTask({title:'Planning Buffer', project:'CRM', description:'Reserved time for whatever the sprint kickoff needs.', estimatedHours:3, completedHours:0, deadline:dkey(FRI), priority:'Low', status:'Planned'});
  seedBlock({taskId:tRetro, day:dkey(FRI), order:0, duration:2});
  seedBlock({taskId:tBreakFri, day:dkey(FRI), order:1, duration:1});
  seedBlock({taskId:tBuffer, day:dkey(FRI), order:2, duration:3});

  // --- Teammates (admin-visible only — plain hours-per-day, no draggable timeline) ---
  function seedTeammateTask(t){ return seedTask(t); } // just a readability alias; userId/assignedDay are passed explicitly below

  // Priya Nair — Product Designer (capacity 7h/day)
  seedTeammateTask({userId:'u2', title:'Wireframe Review', project:'CRM', estimatedHours:3, completedHours:3, assignedDay:dkey(MON), deadline:dkey(MON), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u2', title:'User Interviews', project:'CRM', estimatedHours:3, completedHours:3, assignedDay:dkey(MON), deadline:dkey(MON), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u2', title:'Design System Updates', project:'CRM', estimatedHours:4, completedHours:4, assignedDay:dkey(TUE), deadline:dkey(TUE), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u2', title:'Stakeholder Review', project:'CRM', estimatedHours:3, completedHours:3, assignedDay:dkey(TUE), deadline:dkey(TUE), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u2', title:'Prototype Testing', project:'CRM', estimatedHours:5, completedHours:5, assignedDay:dkey(WED), deadline:dkey(WED), priority:'High', status:'Completed'});
  seedTeammateTask({userId:'u2', title:'Design Critique', project:'CRM', estimatedHours:3, completedHours:3, assignedDay:dkey(WED), deadline:dkey(WED), priority:'Low', status:'Completed'});
  seedTeammateTask({userId:'u2', title:'Customer Module UI Polish', project:'CRM', estimatedHours:4, completedHours:0, assignedDay:TODAY_KEY, deadline:dkey(FRI), priority:'High', status:'In Progress'});
  seedTeammateTask({userId:'u2', title:'Handoff Prep', project:'CRM', estimatedHours:2, completedHours:0, assignedDay:TODAY_KEY, deadline:dkey(FRI), priority:'Medium', status:'Planned'});
  seedTeammateTask({userId:'u2', title:'Sprint Demo Prep', project:'CRM', estimatedHours:3, completedHours:0, assignedDay:dkey(FRI), deadline:dkey(FRI), priority:'Low', status:'Planned'});

  // Marcus Webb — Sales Lead (capacity 8h/day)
  seedTeammateTask({userId:'u3', title:'Pipeline Review', project:'Sales', estimatedHours:2, completedHours:2, assignedDay:dkey(MON), deadline:dkey(MON), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u3', title:'Client Calls', project:'Sales', estimatedHours:4, completedHours:4, assignedDay:dkey(MON), deadline:dkey(MON), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u3', title:'Proposal Writing', project:'Sales', estimatedHours:3, completedHours:3, assignedDay:dkey(TUE), deadline:dkey(TUE), priority:'High', status:'Completed'});
  seedTeammateTask({userId:'u3', title:'Client Calls', project:'Sales', estimatedHours:5, completedHours:5, assignedDay:dkey(TUE), deadline:dkey(TUE), priority:'Medium', status:'Completed'});
  seedTeammateTask({userId:'u3', title:'Contract Negotiation', project:'Sales', estimatedHours:6, completedHours:6, assignedDay:dkey(WED), deadline:dkey(WED), priority:'High', status:'Completed'});

  let viewedKey = TODAY_KEY;   // day shown on the Today view
  let currentView = 'today';
  let dragState = null;

  /* ============================================================
     SCHEDULING ENGINE
  ============================================================ */
  function dayBlocks(key){
    return blocks.filter(b => b.day===key).sort((a,b)=>a.order-b.order);
  }

  function recalcDay(key){
    const list = dayBlocks(key);
    const workEnd = t2m(settings.workEnd);
    let pointer = t2m(settings.workStart);
    const workday = isWorkday(keyToDate(key));
    list.forEach(b=>{
      if(!workday){ b.overflow = true; b.start=null; b.end=null; return; }
      const end = pointer + b.duration*60;
      if(end > workEnd){
        b.overflow = true; b.start=null; b.end=null;
      } else {
        b.overflow = false; b.start = pointer; b.end = end; pointer = end;
      }
    });
  }

  function allDayKeys(){
    return Array.from(new Set(blocks.map(b=>b.day))).sort();
  }

  function recalcAll(logChanges){
    const before = {};
    if(logChanges){ blocks.forEach(b=> before[b.id]=b.overflow); }
    allDayKeys().forEach(recalcDay);
    if(logChanges){
      blocks.forEach(b=>{
        if(before[b.id]===false && b.overflow===true){
          const task = taskById(b.taskId);
          const dest = fmtShort(nextWorkday(keyToDate(b.day)));
          pushHistory(b, `Pushed from ${fmtShort(keyToDate(b.day))} — moved beyond today's capacity, next available day is ${dest}.`, true);
        } else if(before[b.id]===true && b.overflow===false){
          pushHistory(b, `Fits back into ${fmtShort(keyToDate(b.day))} after the schedule change.`, false);
        }
      });
    }
  }

  function daySummary(key){
    const list = dayBlocks(key);
    const scheduled = list.reduce((s,b)=>s+b.duration,0);
    const capacity = isWorkday(keyToDate(key)) ? settings.capacity : 0;
    const overloaded = Math.max(0, scheduled - capacity);
    return {key, list, scheduled, capacity, overloaded, fitted:list.filter(b=>!b.overflow), overflow:list.filter(b=>b.overflow)};
  }

  function statusFor(scheduled, capacity){
    const over = scheduled - capacity;
    if(capacity<=0) return 'ok';
    if(over<=0) return 'ok';
    if(over<=1) return 'tight';
    return 'risk';
  }

  function taskById(id){ return tasks.find(t=>t.id===id); }
  function blockLabel(b){ return b.label || taskById(b.taskId).title; }

  function pushHistory(block, text, isMove){
    history.unshift({id:'h'+(histSeq++), blockId:block.id, taskId:block.taskId, ts:Date.now(), text, isMove});
  }

  function computeDeadlineStatus(task){
    const remaining = Math.max(0, task.estimatedHours - task.completedHours);
    if(remaining<=0) return {level:'ok', label:'Complete', detail:'All estimated hours are logged for this task.'};
    const deadlineDate = keyToDate(task.deadline);
    const isMine = task.userId === currentUserId;
    const cap = isMine ? settings.capacity : userById(task.userId).capacity;
    let cursor = new Date(Math.min(TODAY_DATE.getTime(), deadlineDate.getTime()));
    let available = 0;
    let guard = 0;
    while(cursor <= deadlineDate && guard < 60){
      if(isWorkday(cursor)){
        const key = dkey(cursor);
        const others = isMine
          ? blocks.filter(b=>b.day===key && b.taskId!==task.id).reduce((s,b)=>s+b.duration,0)
          : tasks.filter(t=>t.userId===task.userId && t.assignedDay===key && t.id!==task.id).reduce((s,t)=>s+t.estimatedHours,0);
        available += Math.max(0, cap - others);
      }
      cursor = addDays(cursor,1); guard++;
    }
    const spare = available - remaining;
    if(spare >= 2) return {level:'ok', label:'On Track', detail:`The current schedule can complete this task before ${fmtShort(deadlineDate)}.`};
    if(spare >= 0) return {level:'tight', label:'Tight Schedule', detail:`Only ${spare.toFixed(1)}h of spare capacity remains before ${fmtShort(deadlineDate)}.`};
    return {level:'risk', label:'At Risk', detail:`This task needs ${remaining}h, but only ${available}h are available before ${fmtShort(deadlineDate)}.`};
  }

  /* ============================================================
     ADMIN HELPERS — aggregate any user's day, and any project's progress.
     "You" (currentUserId) reuse the real block-based scheduling engine;
     teammates use a lighter hours-per-day model (no draggable timeline).
  ============================================================ */
  function summaryForUserDay(userId, dayKey){
    if(userId === currentUserId) return daySummary(dayKey);
    const user = userById(userId);
    const list = tasks.filter(t=>t.userId===userId && t.assignedDay===dayKey);
    const scheduled = list.reduce((s,t)=>s+t.estimatedHours,0);
    const capacity = isWorkday(keyToDate(dayKey)) ? user.capacity : 0;
    const overloaded = Math.max(0, scheduled-capacity);
    return {key:dayKey, list, scheduled, capacity, overloaded};
  }

  function scheduleItemsForUserDay(userId, dayKey){
    if(userId === currentUserId){
      return daySummary(dayKey).list.map(b=>{
        const t = taskById(b.taskId);
        return {title:blockLabel(b), project:t.project, duration:b.duration, priority:t.priority, status:t.status, overflow:b.overflow, taskId:t.id};
      });
    }
    return tasks.filter(t=>t.userId===userId && t.assignedDay===dayKey)
      .map(t=>({title:t.title, project:t.project, duration:t.estimatedHours, priority:t.priority, status:t.status, overflow:false, taskId:t.id}));
  }

  function weekKeys(){ return [dkey(MON), dkey(TUE), dkey(WED), dkey(THU), dkey(FRI)]; }

  function tasksForUser(userId){ return tasks.filter(t=>t.userId===userId); }

  function projectStats(projectName){
    const list = tasks.filter(t=>t.project===projectName);
    const totalEst = list.reduce((s,t)=>s+t.estimatedHours,0);
    const totalDone = list.reduce((s,t)=>s+Math.min(t.completedHours,t.estimatedHours),0);
    const pct = totalEst>0 ? Math.round((totalDone/totalEst)*100) : 0;
    const userIds = Array.from(new Set(list.map(t=>t.userId)));
    return {list, count:list.length, totalEst, totalDone, pct, userIds};
  }

  function updateSidebarGauge(){
    const s = daySummary(TODAY_KEY);
    const pct = s.capacity>0 ? Math.min(100, Math.round((s.scheduled/s.capacity)*100)) : 0;
    document.getElementById('sidebarGaugeFill').style.width = pct+'%';
    document.getElementById('sidebarGaugeFill').style.background = s.overloaded>0 ? 'var(--red)' : 'var(--blue)';

  function greeting(){

    if(h<12) return 'Good morning';
    if(h<18) return 'Good afternoon';
    return 'Good evening';

  /* ============================================================
     RENDER — TODAY
  ============================================================ */
  function renderTodayView(){
    const d = keyToDate(viewedKey);
    const s = daySummary(viewedKey);
    const status = statusFor(s.scheduled, s.capacity);
    const remaining = Math.max(0, s.capacity - s.scheduled);

    let html = '';
    html += topbarHtml('Daily plan', fmtLong(d), true);

    const barDenom = Math.max(s.capacity, s.scheduled, 1);
    const fillPct = s.capacity>0 ? (Math.min(s.scheduled, s.capacity) / barDenom) * 100 : 0;
    const overStartPct = s.scheduled>0 ? (s.capacity / barDenom) * 100 : 0;

    html += `<div class="panel gauge-panel">
      <span class="corner-tick tl"></span><span class="corner-tick tr"></span><span class="corner-tick bl"></span><span class="corner-tick br"></span>
      <div class="gauge-top">
        <div class="gauge-greeting">${greeting()} — here's how ${relDay(viewedKey).toLowerCase()==='today' ? 'today' : fmtShort(d)+"'s"} plan looks.</div>
        <div class="gauge-status status-${status==='ok'?'ok':status==='tight'?'tight':'risk'}"><span class="dot"></span>${status==='ok' ? (s.overloaded>0?'At capacity':'On track') : status==='tight' ? 'Tight schedule' : 'Overloaded'}</div>
      </div>
      <div class="gauge-stats">
        <div><div class="gauge-stat-label">WORKING CAPACITY</div><div class="gauge-stat-value">${s.capacity}h</div></div>
        <div><div class="gauge-stat-label">SCHEDULED</div><div class="gauge-stat-value">${s.scheduled}h</div></div>
        <div><div class="gauge-stat-label">${s.overloaded>0?'OVERLOADED':'REMAINING'}</div><div class="gauge-stat-value ${s.overloaded>0?'red':'green'}">${s.overloaded>0? '+'+s.overloaded+'h ⚠' : remaining+'h'}</div></div>
      </div>
      <div class="gauge-bar-track">
        <div class="gauge-bar-fill" style="width:${fillPct}%"></div>
        ${s.overloaded>0 ? `<div class="gauge-bar-over" style="left:${overStartPct}%; right:0;"></div>` : ''}
      </div>
    </div>`;

    html += `<div class="timeline-wrap"><div style="flex:1;">`;

    if(!isWorkday(d)){
      html += `<div class="timeline"><div class="weekend-note">No working hours scheduled — it's the weekend.<br>Use the arrows above to jump back to a working day.</div></div>`;
    } else {
      const workStartM = t2m(settings.workStart), workEndM = t2m(settings.workEnd);
      const totalMin = workEndM - workStartM;
      const pxPerMin = 1.05;
      const heightPx = totalMin*pxPerMin;

      html += `<div class="timeline" id="timelineTrack" style="min-height:${heightPx+20}px;">`;
      // hour ruler
      for(let m=workStartM; m<=workEndM; m+=60){
        const top = (m-workStartM)*pxPerMin;
        html += `<div class="hour-label" style="top:${top}px">${fmtClock(m).replace(':00','')}</div>`;
      }
      // hour grid rows (visual)
      for(let m=workStartM; m<workEndM; m+=60){
        html += `<div class="hour-row" style="height:${60*pxPerMin}px;"></div>`;
      }

      s.fitted.forEach(b=>{
        const top = (b.start-workStartM)*pxPerMin;
        const h = Math.max(38, (b.end-b.start)*pxPerMin - 6);
        const task = taskById(b.taskId);
        html += `<div class="block-card" draggable="true" data-block="${b.id}" style="top:${top}px; height:${h}px;">
          <div class="block-time-tab">${fmtClock(b.start).replace(' ', '')}</div>
          <button class="block-move" data-move="${b.id}" title="Move to next available day">→</button>
          <div class="block-body">
            <div class="block-title">${escapeHtml(blockLabel(b))}</div>
            <div class="block-sub">${escapeHtml(task.project)} · ${b.duration}h</div>
            <div class="block-meta">
              <span class="block-chip"><span class="prio-dot prio-${task.priority}"></span>${task.priority}</span>
              <span class="block-chip">due ${fmtShort(keyToDate(task.deadline))}</span>
            </div>
          </div>
        </div>`;
      });

      // insert-between-cards affordances — like inserting a row between two rows
      function gapTrigger(pxTop, beforeId){
        return `<div class="insert-gap" style="top:${pxTop-9}px" data-before="${beforeId}">
          <div class="insert-gap-line"></div>
          <button class="insert-gap-btn" data-before="${beforeId}" title="Insert a task here">+ Add task here</button>
        </div>`;
      }
      if(s.fitted.length===0){
        html += gapTrigger(0, 'end');
      } else {
        s.fitted.forEach(b=>{
          html += gapTrigger((b.start-workStartM)*pxPerMin, b.id);
        });
        const lastB = s.fitted[s.fitted.length-1];
        html += gapTrigger((lastB.end-workStartM)*pxPerMin, 'end');
      }

      html += `</div>`; // .timeline
    }
    html += `</div></div>`; // timeline-wrap

    if(isWorkday(d) && s.overflow.length){
      html += `<div class="overflow-zone"><div class="overflow-zone-title">⚠ ${s.overloaded}h overloaded — will move to the next available working day</div>`;
      s.overflow.forEach(b=>{
        const task = taskById(b.taskId);
        html += `<div class="overflow-card">
          <div class="overflow-card-main">
            <div class="overflow-card-title">${escapeHtml(blockLabel(b))} · ${b.duration}h</div>
            <div class="overflow-card-note">Pushed to ${fmtShort(nextWorkday(d))} — no capacity left today</div>
          </div>
          <button class="btn secondary" style="padding:6px 10px; font-size:12px;" data-move="${b.id}">Move now</button>
        </div>`;
      });
      html += `</div>`;
    }

    content.innerHTML = html;
    bindTopbarDateStrip();
    bindAddTaskButton();
    bindBlockInteractions();
  }

  function topbarHtml(eyebrow, title, withDateStrip, actionBtn){
    if(actionBtn === undefined) actionBtn = {id:'addTaskBtn', label:'+ Add task'};
    const d = keyToDate(viewedKey);
    let strip = '';
    if(withDateStrip){
      strip = `<div class="date-strip">
        <button class="date-arrow" id="datePrev">‹</button>`;
      for(let off=-2; off<=2; off++){
        const dd = addDays(d, off);
        const k = dkey(dd);
        const isToday = k===TODAY_KEY, isActive = off===0;
        strip += `<button class="date-pill ${isToday?'is-today':''} ${isActive?'is-active':''}" data-jump="${k}">${fmtShort(dd)}</button>`;
      }
      strip += `<button class="date-arrow" id="dateNext">›</button></div>`;
    }
    return `<div class="topbar">
      <div><div class="view-eyebrow">${eyebrow}</div><div class="view-title">${title}</div></div>
      <div style="display:flex; align-items:center; gap:14px;">
        ${strip}
        ${actionBtn ? `<button class="btn" id="${actionBtn.id}">${actionBtn.label}</button>` : ''}
      </div>
    </div>`;
  }

  function bindTopbarDateStrip(){
    const prev = document.getElementById('datePrev'), next = document.getElementById('dateNext');
    if(prev) prev.addEventListener('click', ()=>{ viewedKey = dkey(addDays(keyToDate(viewedKey),-1)); renderTodayView(); });
    if(next) next.addEventListener('click', ()=>{ viewedKey = dkey(addDays(keyToDate(viewedKey),1)); renderTodayView(); });
    document.querySelectorAll('[data-jump]').forEach(el=>{
      el.addEventListener('click', ()=>{ viewedKey = el.dataset.jump; renderTodayView(); });
    });
  }

  function bindAddTaskButton(){
    const btn = document.getElementById('addTaskBtn');
    if(btn) btn.addEventListener('click', ()=> openAddModal());
  }

  function bindBlockInteractions(){
    document.querySelectorAll('[data-move]').forEach(el=>{
      el.addEventListener('click', e=>{ e.stopPropagation(); moveBlockToNextDay(el.dataset.move); });
    });
    document.querySelectorAll('.insert-gap-btn').forEach(el=>{
      el.addEventListener('click', e=>{
        e.stopPropagation();
        openQuickInsert(el, viewedKey, el.dataset.before);
      });
    });
    document.querySelectorAll('.block-card').forEach(card=>{
      card.addEventListener('click', ()=> openDetail(blockOwnerTask(card.dataset.block)));
      card.addEventListener('dragstart', e=>{
        dragState = card.dataset.block;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        document.querySelectorAll('.block-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
        commitDomOrder();
      });
      card.addEventListener('dragover', e=>{
        e.preventDefault();
        if(!dragState || dragState===card.dataset.block) return;
        const rect = card.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height/2;
        document.querySelectorAll('.block-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
        card.classList.add(before ? 'drop-before' : 'drop-after');
        const track = document.getElementById('timelineTrack');
        const draggedEl = track.querySelector(`[data-block="${dragState}"]`);
        if(draggedEl){
          if(before) card.parentNode.insertBefore(draggedEl, card);
          else card.parentNode.insertBefore(draggedEl, card.nextSibling);
        }
      });
    });
  }

  function commitDomOrder(){
    const track = document.getElementById('timelineTrack');
    if(!track) return;
    const ids = Array.from(track.querySelectorAll('.block-card')).map(c=>c.dataset.block);
    ids.forEach((id,idx)=>{
      const b = blocks.find(x=>x.id===id);
      if(b) b.order = idx;
    });
    recalcAll(true);
    render();
  }

  function blockOwnerTask(blockId){
    const b = blocks.find(x=>x.id===blockId);
    return b ? b.taskId : null;
  }

  function moveBlockToNextDay(blockId){
    const b = blocks.find(x=>x.id===blockId);
    if(!b) return;
    const dest = dkey(nextWorkday(keyToDate(b.day)));
    const maxOrder = Math.max(-1, ...blocks.filter(x=>x.day===dest).map(x=>x.order));
    b.day = dest; b.order = maxOrder+1;
    recalcAll(false);
    pushHistory(b, `Manually moved to ${fmtShort(keyToDate(dest))}.`, true);
    toast(`Moved "${blockLabel(b)}" to ${fmtShort(keyToDate(dest))}`);
    render();
  }

  /* ============================================================

  ============================================================ */
  function renderOverviewView(){
    let html = topbarHtml('This week', 'Workload overview', false);
    html += `<div class="week-chart">`;
    for(let off=-3; off<=1; off++){
      const dd = addDays(TODAY_DATE, off);
      const key = dkey(dd);
      const s = daySummary(key);
      const status = statusFor(s.scheduled, s.capacity);
      const color = status==='ok' ? 'var(--green)' : status==='tight' ? 'var(--amber)' : 'var(--red)';
      const badgeClass = status==='ok' ? 'b-ok' : status==='tight' ? 'b-tight' : 'b-risk';
      const badgeText = status==='ok' ? 'On track' : status==='tight' ? 'Tight' : 'At risk';
      const pct = Math.min(100, (s.scheduled / Math.max(s.capacity, s.scheduled, 1)) * 100);
      html += `<div class="week-chart-row">
        <div class="week-chart-day"><div class="week-chart-day-name">${fmtWeekdayLong(dd)}${key===TODAY_KEY?' · Today':''}</div><div class="week-chart-day-date">${fmtShort(dd)}</div></div>

    }

  /* ============================================================
     SHARED: create a task + insert its block at a given position
  ============================================================ */
  function createTaskAndInsert({title, project, description, priority, duration, deadline, day, position}){
    const taskId = seedTask({title, project, description, estimatedHours:duration, completedHours:0, deadline, priority, status:'Planned'});
    let order;
    if(position==='end' || !position){
      const maxOrder = Math.max(-1, ...blocks.filter(b=>b.day===day).map(b=>b.order));
      order = maxOrder+1;
    } else {
      const beforeBlock = blocks.find(b=>b.id===position);
      const maxOrder = Math.max(-1, ...blocks.filter(b=>b.day===day).map(b=>b.order));
      order = beforeBlock ? beforeBlock.order - 0.5 : maxOrder+1;
    }
    seedBlock({taskId, day, order, duration});
    dayBlocks(day).forEach((b,idx)=>{ b.order = idx; }); // renormalize to clean integers
    recalcAll(true);
    viewedKey = day;
    const summary = daySummary(day);
    const wasOverloaded = summary.overloaded > 0;
    toast(wasOverloaded ? `"${title}" added — ${relDay(day).toLowerCase()} is now ${summary.overloaded}h over capacity.` : `"${title}" added to ${relDay(day)}.`, wasOverloaded);
    switchView('today');
  }

  /* ============================================================
     QUICK INSERT — add a task right between two existing cards,
     the way you'd insert a row in a spreadsheet.
  ============================================================ */
  function closeQuickInsert(){
    const existing = document.getElementById('quickInsertPopover');
    if(existing) existing.remove();
    document.removeEventListener('mousedown', quickInsertOutsideHandler, true);
  }
  let quickInsertOutsideHandler = null;

  function openQuickInsert(anchorEl, day, position){
    closeQuickInsert();
    const rect = anchorEl.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.id = 'quickInsertPopover';
    pop.className = 'quick-insert';
    pop.innerHTML = `
      <input type="text" id="qiTitle" placeholder="Task title…">
      <div class="quick-insert-row">
        <input type="number" id="qiDuration" min="0.5" step="0.5" value="1" title="Duration (hours)">
        <select id="qiPriority" title="Priority">
          <option>Medium</option><option>High</option><option>Low</option>
        </select>
      </div>
      <div class="quick-insert-foot">
        <button class="quick-insert-more" id="qiMore">More options…</button>
        <div class="quick-insert-actions">
          <button class="btn secondary" id="qiCancel" style="padding:6px 10px; font-size:12px;">Cancel</button>
          <button class="btn" id="qiAdd" style="padding:6px 10px; font-size:12px;">Add</button>
        </div>
      </div>`;
    document.body.appendChild(pop);

    // position near the trigger, keeping it on-screen
    const popW = 280;
    let left = Math.min(window.innerWidth - popW - 16, Math.max(16, rect.left - 40));
    let top = rect.bottom + 8;
    if(top + 130 > window.innerHeight) top = Math.max(16, rect.top - 138);
    pop.style.left = left+'px';
    pop.style.top = top+'px';

    const titleInput = document.getElementById('qiTitle');
    titleInput.focus();

    function submit(){
      const title = titleInput.value.trim();
      if(!title){ titleInput.focus(); titleInput.style.borderColor = 'var(--red)'; return; }
      const duration = Math.max(0.5, parseFloat(document.getElementById('qiDuration').value) || 1);
      const priority = document.getElementById('qiPriority').value;
      closeQuickInsert();
      createTaskAndInsert({
        title, project:'General', description:'', priority, duration,
        deadline: day, day, position
      });
    }

    titleInput.addEventListener('keydown', e=>{
      if(e.key==='Enter') submit();
      if(e.key==='Escape') closeQuickInsert();
    });
    document.getElementById('qiAdd').addEventListener('click', submit);
    document.getElementById('qiCancel').addEventListener('click', closeQuickInsert);
    document.getElementById('qiMore').addEventListener('click', ()=>{
      const typed = titleInput.value.trim();
      closeQuickInsert();
      openAddModal({day, position, title: typed});
    });

    quickInsertOutsideHandler = e=>{
      if(!pop.contains(e.target) && e.target!==anchorEl) closeQuickInsert();
    };
    setTimeout(()=> document.addEventListener('mousedown', quickInsertOutsideHandler, true), 0);
  }

  /* ============================================================
     ADD TASK MODAL (full form — project, description, deadline)
  ============================================================ */
  function openAddModal(opts){
    opts = opts || {};
    const initialDay = opts.day || viewedKey;
    const dayOptions = [];
    for(let off=-3; off<=4; off++){
      const dd = addDays(TODAY_DATE, off);
      if(!isWorkday(dd)) continue;
      dayOptions.push(`<option value="${dkey(dd)}" ${dkey(dd)===initialDay?'selected':''}>${relDay(dkey(dd))} — ${fmtShort(dd)}</option>`);
    }
    const hasPrefill = opts.title !== undefined;
    const titleVal = hasPrefill ? opts.title : 'Proposal';
    const projectVal = hasPrefill ? 'General' : 'Sales';
    const descVal = hasPrefill ? '' : 'Draft the Q3 services proposal for a new account.';
    const projectOptions = projects.map(p=>`<option value="${escapeHtml(p.name)}" ${p.name===projectVal?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'addOverlay';
    overlay.innerHTML = `<div class="modal">
      <div class="modal-head"><h2>Add task</h2><button class="modal-close" id="addClose">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Task title</label><input type="text" id="fTitle" value="${escapeHtml(titleVal)}" placeholder="e.g. Client Proposal"></div>
        <div class="field-row">
          <div class="field"><label>Project</label><select id="fProject">${projectOptions}</select></div>
          <div class="field"><label>Priority</label>
            <select id="fPriority"><option>High</option><option>Medium</option><option>Low</option></select>
          </div>
        </div>
        <div class="field"><label>Description (optional)</label><textarea id="fDesc" placeholder="What does this task involve?">${escapeHtml(descVal)}</textarea></div>
        <div class="field-row">
          <div class="field"><label>Estimated duration (hours)</label><input type="number" id="fDuration" min="0.5" step="0.5" value="2"></div>
          <div class="field"><label>Deadline</label><input type="date" id="fDeadline" value="${TODAY_KEY}"></div>
        </div>
        <div class="field"><label>Schedule on</label><select id="fDay">${dayOptions.join('')}</select></div>
        <div class="field"><label>Place in timeline</label><select id="fPosition"></select></div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="addCancel">Cancel</button>
        <button class="btn" id="addSubmit">Add to schedule</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);

    const daySel = document.getElementById('fDay');
    const posSel = document.getElementById('fPosition');
    function refreshPositions(preselect){
      const list = dayBlocks(daySel.value);
      let optsHtml = `<option value="end">Add to end of the day</option>`;
      list.forEach(b=>{ optsHtml += `<option value="${b.id}">Insert before "${escapeHtml(blockLabel(b))}"</option>`; });
      posSel.innerHTML = optsHtml;
      if(preselect && Array.from(posSel.options).some(o=>o.value===preselect)) posSel.value = preselect;
    }
    refreshPositions(opts.position);
    daySel.addEventListener('change', ()=>refreshPositions());

    function close(){ overlay.remove(); }
    document.getElementById('addClose').addEventListener('click', close);
    document.getElementById('addCancel').addEventListener('click', close);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

    document.getElementById('addSubmit').addEventListener('click', ()=>{
      const title = document.getElementById('fTitle').value.trim() || 'Untitled task';
      const project = document.getElementById('fProject').value || 'General';
      const desc = document.getElementById('fDesc').value.trim();
      const priority = document.getElementById('fPriority').value;
      const duration = Math.max(0.5, parseFloat(document.getElementById('fDuration').value) || 1);
      const deadline = document.getElementById('fDeadline').value || TODAY_KEY;
      const day = daySel.value;
      const position = posSel.value;
      close();
      createTaskAndInsert({title, project, description:desc, priority, duration, deadline, day, position});
    });
  }


  /* ============================================================
     TASK DETAIL PANEL
  ============================================================ */
  function openDetail(taskId){
    if(!taskId) return;
    const task = taskById(taskId);
    if(!task) return;
    const isMine = task.userId === currentUserId;
    const owner = userById(task.userId);
    const dstat = computeDeadlineStatus(task);
    const remaining = Math.max(0, task.estimatedHours - task.completedHours);
    const tblocks = blocks.filter(b=>b.taskId===taskId);
    const hist = history.filter(h=>h.taskId===taskId);

    const overlay = document.createElement('div');
    overlay.className = 'detail-overlay';
    overlay.id = 'detailOverlay';
    const panel = document.createElement('div');
    panel.className = 'detail-panel';

    let scheduleRows;
    if(isMine){
      scheduleRows = tblocks.length ? tblocks.map(b=>{
        return `<div class="detail-row"><span class="detail-row-label">${relDay(b.day)} (${fmtShort(keyToDate(b.day))})</span><span>${b.overflow ? 'Overflow — pending move' : fmtClock(b.start)+' · '+b.duration+'h'}</span></div>`;
      }).join('') : `<div class="detail-row"><span class="detail-row-label">No blocks scheduled yet</span></div>`;
    } else {
      scheduleRows = task.assignedDay
        ? `<div class="detail-row"><span class="detail-row-label">${relDay(task.assignedDay)} (${fmtShort(keyToDate(task.assignedDay))})</span><span>${task.estimatedHours}h planned</span></div>`
        : `<div class="detail-row"><span class="detail-row-label">Not yet scheduled</span></div>`;
    }

    let historyRows = hist.length ? hist.map(h=>`
      <div class="history-item ${h.isMove?'is-move':''}">
        <div class="history-dot"></div>
        <div><div class="history-text">${escapeHtml(h.text)}</div></div>
      </div>`).join('') : `<div class="empty-hint">No changes recorded yet for this task.</div>`;

    panel.innerHTML = `
      <div class="detail-head">
        <div class="detail-head-top">
          <div><div class="detail-project">${escapeHtml(task.project)}</div><div class="detail-title">${escapeHtml(task.title)}</div></div>
          <button class="modal-close" id="detailClose">✕</button>
        </div>
        <span class="badge ${dstat.level==='ok'?'b-ok':dstat.level==='tight'?'b-tight':'b-risk'}">${dstat.label}</span>
      </div>
      <div class="detail-body">
        ${!isMine ? `<div class="detail-section"><h4>ASSIGNED TO</h4>
          <div class="user-card-top"><div class="user-avatar" style="background:${owner.color}">${initials(owner.name)}</div>
          <div><div class="user-card-name">${escapeHtml(owner.name)}</div><div class="user-card-role">${escapeHtml(owner.role)}</div></div></div>
        </div>` : ''}
        ${task.description ? `<div class="detail-section"><h4>DESCRIPTION</h4><div class="detail-desc">${escapeHtml(task.description)}</div></div>` : ''}
        <div class="detail-section">
          <h4>PROGRESS</h4>
          <div class="detail-stats">
            <div><div class="detail-stat-label">Estimated</div><div class="detail-stat-value">${task.estimatedHours}h</div></div>
            <div><div class="detail-stat-label">Completed</div><div class="detail-stat-value">${task.completedHours}h</div></div>
            <div><div class="detail-stat-label">Remaining</div><div class="detail-stat-value">${remaining}h</div></div>
          </div>
        </div>
        <div class="detail-section">
          <h4>DETAILS</h4>
          <div class="detail-row"><span class="detail-row-label">Deadline</span><span>${fmtShort(keyToDate(task.deadline))}</span></div>
          <div class="detail-row"><span class="detail-row-label">Priority</span><span>${task.priority}</span></div>
          <div class="detail-row"><span class="detail-row-label">Status</span><span>${task.status}</span></div>
        </div>
        <div class="detail-section"><h4>SCHEDULE</h4>${scheduleRows}</div>
        <div class="detail-section"><h4>DEADLINE RISK</h4><div class="detail-desc">${dstat.detail}</div></div>
        ${isMine ? `<div class="detail-section"><h4>SCHEDULE HISTORY</h4>${historyRows}</div>` : ''}
      </div>
      <div class="detail-foot">
        ${isMine ? `
          <button class="btn secondary" id="detailComplete">Mark complete</button>
          <button class="btn danger" id="detailDelete">Delete task</button>
        ` : `<div class="empty-hint" style="padding:0;">Viewing as admin — ${escapeHtml(owner.name.split(' ')[0])} manages this task from their own account.</div>`}
      </div>`;

    document.body.appendChild(overlay);
    document.body.appendChild(panel);

    function close(){ overlay.remove(); panel.remove(); }
    overlay.addEventListener('click', close);
    document.getElementById('detailClose').addEventListener('click', close);
    if(isMine){
      document.getElementById('detailComplete').addEventListener('click', ()=>{
        task.completedHours = task.estimatedHours; task.status='Completed';
        toast(`"${task.title}" marked complete.`);
        close(); render();
      });
      document.getElementById('detailDelete').addEventListener('click', ()=>{
        for(let i=blocks.length-1;i>=0;i--){ if(blocks[i].taskId===taskId) blocks.splice(i,1); }
        const idx = tasks.findIndex(t=>t.id===taskId);
        if(idx>-1) tasks.splice(idx,1);
        recalcAll(true);
        toast(`"${task.title}" deleted — schedule recalculated.`);
        close(); render();
      });
    }
  }

  /* ============================================================
     TOASTS + UTIL
  ============================================================ */
  function toast(msg, warn){
    const c = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast' + (warn ? ' warn' : '');
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 3200);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ============================================================
     INIT
  ============================================================ */
  deriveWorkEnd();
  document.querySelector('.nav-item[data-view="today"]').classList.add('active');
  render();
})();
</script>
</body>
